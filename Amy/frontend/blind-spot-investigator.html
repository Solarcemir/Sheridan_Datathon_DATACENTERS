<style>
/* Blind Spot Investigator. Same design tokens as the team's other pages (light by default, dark with the system or the toggle;
   Archivo condensed display type, IBM Plex text, flat panels on a dot grid). One idea drives the layout: every confirmed exploit sits
   on a single rank axis with the review line at 517; everything else explains the dots on the wrong side of that line.
   Data: ../feature/output/dashboard_investigations.json (built by Amy/feature/build_dashboard_data.py). */
:root {
  --bg: #e9edf2; --panel: #ffffff; --ink: #0f1a2a; --muted: #586579; --line-c: #c3ccd8; --soft: #dde3eb; --grid: #d3dae4; --region: #f4f6f9;
  --ibm: #2b59e0; --ibm-soft: #e2e9fc; --alert: #c4302b; --alert-soft: #f8e2e0; --ok: #1d7f55; --warn-c: #a8650a; --warn-soft: #fbefd9;
  --teal: #00797a; --violet: #6f3fd1; --pink: #b8186a; --orange-c: #b9560a;
  --shadow: 0 1px 2px rgba(15,26,42,.06), 0 10px 28px -14px rgba(15,26,42,.22);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070c13; --panel: #121c2a; --ink: #f2f6fb; --muted: #aebbd0; --line-c: #40536f; --soft: #1c2738; --grid: #1a2535; --region: #0d1520;
  --ibm: #8eaaff; --ibm-soft: #1c2b55; --alert: #ff7b70; --alert-soft: #45201f; --ok: #4cc58f; --warn-c: #ffb547; --warn-soft: #3a2a10;
  --teal: #3ad0cc; --violet: #b99bff; --pink: #ff7eb6; --orange-c: #ff9b4a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -14px rgba(0,0,0,.7); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #070c13; --panel: #121c2a; --ink: #f2f6fb; --muted: #aebbd0; --line-c: #40536f; --soft: #1c2738; --grid: #1a2535; --region: #0d1520;
  --ibm: #8eaaff; --ibm-soft: #1c2b55; --alert: #ff7b70; --alert-soft: #45201f; --ok: #4cc58f; --warn-c: #ffb547; --warn-soft: #3a2a10;
  --teal: #3ad0cc; --violet: #b99bff; --pink: #ff7eb6; --orange-c: #ff9b4a; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 32px -14px rgba(0,0,0,.7); color-scheme: dark; }
:root {
  --bg-deep: var(--bg); --surface: var(--panel); --surface-2: var(--region); --surface-3: var(--soft);
  --text: var(--ink); --text-2: var(--muted); --text-3: color-mix(in srgb, var(--muted) 75%, var(--bg));
  --line: var(--line-c); --line-2: color-mix(in srgb, var(--line-c) 70%, var(--ink) 30%);
  --s1: var(--ibm); --s2: var(--teal); --s3: var(--violet); --s4: var(--pink);
  --good: var(--ok); --bad: var(--alert); --warn: var(--warn-c); --orange: var(--orange-c);
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --wash: color-mix(in srgb, var(--ink) 5%, transparent);
  --near: var(--warn); --mid: var(--orange); --deep: var(--bad);
  --m-lr: var(--s1); --m-lora: var(--s3); --m-lgbm: var(--s2);
  --c-signal: var(--s1); --c-gap: var(--s2); --c-dis: var(--s3); --c-dq: var(--s4);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.65, 0, .35, 1);
  --glass: var(--panel);
  --hatch: repeating-linear-gradient(-45deg, color-mix(in srgb, var(--warn) 30%, transparent) 0 5px, transparent 5px 10px);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
body { margin: 0; background: var(--bg-deep); color: var(--text); font-family: var(--sans); font-size: .9rem; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: #9cbcff; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 3px; }
h1, h2, h3, h4 { margin: 0; font-weight: 400; text-wrap: balance; }
p { margin: 0; }
.mono { font-family: var(--mono); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 max(18px, env(safe-area-inset-left)); }

.glow { position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: radial-gradient(900px 520px at 12% -10%, rgba(69,137,255,.17), transparent 60%),
              radial-gradient(800px 520px at 92% 4%, rgba(165,110,255,.13), transparent 60%),
              radial-gradient(900px 600px at 50% 112%, rgba(250,77,86,.08), transparent 60%), var(--bg-deep); }
.dots { position: fixed; inset: -10%; z-index: -1; pointer-events: none; opacity: .28;
  background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1.4px); background-size: 26px 26px;
  animation: drift 60s linear infinite; mask-image: radial-gradient(70% 60% at 50% 30%, #000 40%, transparent 100%); }
@keyframes drift { to { background-position: 520px 260px; } }

/* header */
header.bar { position: sticky; top: 0; z-index: 30; padding: 12px 0; border-bottom: 1px solid var(--line); background: rgba(2,2,3,.62); backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%); }
.bar-in { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.brand .mk { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 4px rgba(250,77,86,.18), 0 0 16px 3px rgba(250,77,86,.6); animation: beat 2.6s ease-in-out infinite; }
@keyframes beat { 50% { box-shadow: 0 0 0 7px rgba(250,77,86,.06), 0 0 22px 4px rgba(250,77,86,.35); } }
.brand b { font-weight: 600; letter-spacing: .03em; font-size: .95rem; }
.brand span { font-family: var(--mono); font-size: .66rem; color: var(--text-3); letter-spacing: .1em; text-transform: uppercase; }
.readout { margin-left: auto; display: flex; gap: 22px; flex-wrap: wrap; }
.readout div { display: grid; gap: 0; text-align: right; }
.readout b { font-family: var(--mono); font-weight: 500; font-size: 1.05rem; font-variant-numeric: tabular-nums; text-shadow: 0 0 18px rgba(69,137,255,.35); }
.readout b.g { color: var(--good); text-shadow: 0 0 18px rgba(66,190,101,.35); } .readout b.r { color: var(--bad); text-shadow: 0 0 18px rgba(250,77,86,.4); }
.readout i { font-style: normal; font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
@media (max-width: 760px) { .readout { display: none; } }

/* shared */
.eyebrow { font-family: var(--mono); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: #9cbcff; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 24px 50px rgba(0,0,0,.42); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px 3px 7px; border-radius: 999px; white-space: nowrap; }
.badge svg { width: 11px; height: 11px; }
.badge.ver { color: var(--good); border: 1px solid rgba(66,190,101,.45); background: rgba(66,190,101,.08); }
.badge.ai { color: #d4bbff; border: 1px solid rgba(165,110,255,.5); background: linear-gradient(90deg, rgba(165,110,255,.16), rgba(69,137,255,.08)); }
.badge.unk { color: var(--warn); border: 1px solid rgba(241,194,27,.5); background: var(--hatch); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.sec-head h2 { font-size: clamp(1.5rem, 2.6vw, 2.05rem); font-weight: 300; line-height: 1.12; margin-top: 8px; max-width: 30ch; }
.sec-head h2 b { font-weight: 600; }
.sec-head p { color: var(--text-2); max-width: 62ch; margin-top: 8px; }
section.block { padding: 64px 0 8px; }
.grad { background: linear-gradient(90deg, #ffb3b8, #ff8389 45%, #d4bbff); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* hero */
.hero { padding: 46px 0 10px; }
.hero-top { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 34px; align-items: end; }
@media (max-width: 900px) { .hero-top { grid-template-columns: minmax(0, 1fr); } }
.hero h1 { font-size: clamp(2.1rem, 5vw, 3.6rem); font-weight: 300; line-height: 1.04; letter-spacing: -.015em; margin-top: 12px; }
.hero h1 b { font-weight: 600; }
.hero .lead { color: var(--text-2); font-size: 1.02rem; margin-top: 16px; max-width: 60ch; }
.keyread { display: grid; gap: 10px; }
.keyread .kr { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
.keyread .kr p { color: var(--text-2); font-size: .8rem; }

.depth { margin-top: 30px; padding: 18px 20px 14px; position: relative; overflow: hidden; }
.depth-head { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: baseline; }
.depth-head strong { font-weight: 500; font-size: .95rem; }
.depth-head span { color: var(--text-3); font-size: .76rem; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: .66rem; color: var(--text-3); margin-top: 8px; }
.legend button { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; }
.legend button:hover { color: var(--text); }
.legend button[aria-pressed="true"] { border-color: var(--line-2); color: var(--text); background: var(--surface-2); }
.legend button:focus-visible { outline: 2px solid #fff; }
.legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
#depthSvg { display: block; width: 100%; height: 250px; margin-top: 6px; overflow: visible; }
#depthSvg .zone { fill: rgba(66,190,101,.07); }
#depthSvg .zoneline { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 3 4; }
#depthSvg .zl { font-family: var(--mono); font-size: 10.5px; fill: var(--good); letter-spacing: .08em; }
#depthSvg .zr { font-family: var(--mono); font-size: 10.5px; fill: var(--bad); letter-spacing: .08em; }
#depthSvg .tick line { stroke: var(--line-2); }

#depthSvg circle.pt:hover, #depthSvg circle.pt.sel { r: 8; stroke: #fff; stroke-width: 1.6; }
#depthSvg circle.pt.dim { opacity: .14; }
#depthSvg circle.pt:focus-visible { outline: none; stroke: #fff; stroke-width: 2.4; }
#depthSvg .halo { fill: none; stroke: #fff; stroke-width: 1.2; opacity: .7; animation: halo 1.8s ease-out infinite; pointer-events: none; }
@keyframes halo { from { r: 8; opacity: .8; } to { r: 22; opacity: 0; } }

.tip { position: fixed; z-index: 60; pointer-events: none; background: rgba(18,18,25,.94); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; font-size: .74rem; max-width: 280px; box-shadow: 0 16px 40px rgba(0,0,0,.6); opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; backdrop-filter: blur(8px); }
.tip.on { opacity: 1; transform: none; }
.tip b { font-family: var(--mono); font-weight: 600; display: block; }
.tip span { color: var(--text-2); }

/* anatomy */
.anat { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.anat .panel { padding: 18px 20px; min-width: 0; }
.span7 { grid-column: span 7; } .span5 { grid-column: span 5; } .span6 { grid-column: span 6; } .span12 { grid-column: span 12; }
@media (max-width: 960px) { .span7, .span5, .span6 { grid-column: span 12; } }
.ph { display: flex; justify-content: space-between; gap: 10px; align-items: start; flex-wrap: wrap; margin-bottom: 12px; }
.ph h3 { font-size: 1rem; font-weight: 500; }
.ph p { color: var(--text-3); font-size: .76rem; margin-top: 2px; max-width: 56ch; }
.dumb { display: grid; gap: 12px; }
.db { display: grid; grid-template-columns: minmax(0, 210px) minmax(0, 1fr) 92px; gap: 12px; align-items: center; font-size: .78rem; }
.db .l { color: var(--text-2); line-height: 1.25; }
.db .tr { position: relative; height: 18px; }
.db .tr::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--line-2); }
.db .seg { position: absolute; top: calc(50% - 2px); height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--bad), var(--good)); opacity: .55; transition: left 1s var(--ease), width 1s var(--ease); }
.db .dot { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 2px solid var(--bg-deep); transition: left 1s var(--ease); }
.db .dot.c { background: var(--good); box-shadow: 0 0 12px rgba(66,190,101,.6); } .db .dot.m { background: var(--bad); box-shadow: 0 0 12px rgba(250,77,86,.6); }
.db .v { font-family: var(--mono); font-size: .72rem; text-align: right; color: var(--text-3); white-space: nowrap; }
.db .v b { color: var(--good); font-weight: 500; } .db .v em { color: var(--bad); font-style: normal; }
@media (max-width: 560px) { .db { grid-template-columns: minmax(0, 1fr) 84px; } .db .tr { grid-column: 1 / -1; grid-row: 2; } }

.stack { display: flex; height: 46px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line-2); margin-top: 6px; }
.stack button { all: unset; cursor: pointer; display: flex; flex-direction: column; justify-content: center; padding: 0 12px; min-width: 0; overflow: hidden; white-space: nowrap; transition: width 1s var(--ease), filter .15s; width: 0; }
.stack button:hover { filter: brightness(1.2); }
.stack button:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
.stack b { font-family: var(--mono); font-size: .95rem; font-weight: 600; }
.stack span { font-size: .64rem; opacity: .85; }
.stack .s-code { background: rgba(66,190,101,.22); color: #a7f0ba; }
.stack .s-zero { background: rgba(250,77,86,.18); color: #ffb3b8; }
.stack .s-unk { background: var(--hatch), rgba(241,194,27,.08); color: var(--warn); }
.stack-key { display: grid; gap: 8px; margin-top: 14px; font-size: .78rem; color: var(--text-2); }
.stack-key div { display: grid; grid-template-columns: 14px 1fr; gap: 10px; align-items: start; }
.stack-key i { width: 12px; height: 12px; border-radius: 3px; margin-top: 3px; }

.gaps { display: grid; gap: 8px; }
.gap { all: unset; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 120px 40px; gap: 12px; align-items: center; padding: 6px 8px; border-radius: 10px; font-size: .8rem; color: var(--text-2); }
.gap:hover { background: rgba(255,255,255,.04); color: var(--text); }
.gap:focus-visible { outline: 2px solid #fff; }
.gap .tr { height: 8px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.gap .tr i { display: block; height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--s2), var(--s1)); transition: width 1s var(--ease); }
.gap .n { font-family: var(--mono); text-align: right; color: var(--text); }
.gap.unk .tr i { background: var(--hatch), var(--warn); }

.verdict { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: center; }
@media (max-width: 700px) { .verdict { grid-template-columns: minmax(0, 1fr); } }
.vs { display: flex; align-items: end; gap: 18px; }
.vs .col { display: grid; gap: 6px; justify-items: start; }
.vs .big { font-family: var(--mono); font-size: 2.3rem; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.vs .big.r { color: var(--bad); } .vs .big.mu { color: var(--text-2); }
.vs .cap { font-size: .72rem; color: var(--text-3); max-width: 22ch; line-height: 1.3; }
.vs .x { font-family: var(--mono); color: var(--text-3); padding-bottom: 14px; }
.budget { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.budget div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; text-align: center; background: rgba(255,255,255,.02); }
.budget b { display: block; font-family: var(--mono); font-size: 1.05rem; font-weight: 500; }
.budget b.neg { color: var(--bad); } .budget b.zero { color: var(--text-2); }
.budget span { font-size: .62rem; color: var(--text-3); font-family: var(--mono); letter-spacing: .06em; }
.verdict-line { font-size: 1.02rem; font-weight: 300; line-height: 1.4; }
.verdict-line b { font-weight: 600; }

.cohort-d summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cohort-d summary::-webkit-details-marker { display: none; }
.cohort-d summary h3::after { content: " +"; color: var(--text-3); font-weight: 400; }
.cohort-d[open] summary h3::after { content: " −"; }
.cohort-d[open] summary { margin-bottom: 14px; }
.cohort-ai { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .cohort-ai { grid-template-columns: minmax(0, 1fr); } }
.cohort-ai .ta { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: rgba(255,255,255,.02); display: grid; gap: 6px; align-content: start; }
.cohort-ai .ta h4 { font-size: .85rem; font-weight: 500; }
.cohort-ai .ta p { font-size: .76rem; color: var(--text-2); }
.cohort-ai .ta p.lim { color: var(--text-3); }

/* explorer */
.explorer { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .explorer { grid-template-columns: minmax(0, 1fr); } }
.rail { padding: 14px; display: flex; flex-direction: column; }
@media (max-width: 980px) { .rail { position: static; max-height: none; min-height: 0; } }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 0 12px; }
.search:focus-within { border-color: var(--s1); }
.search input { all: unset; flex: 1; padding: 10px 0; font-size: .84rem; min-width: 0; }
.search kbd { font-family: var(--mono); font-size: .64rem; color: var(--text-3); border: 1px solid var(--line-2); border-radius: 5px; padding: 1px 6px; }
.filters { display: grid; gap: 8px; margin: 12px 0 10px; }
.frow { display: flex; gap: 5px; flex-wrap: wrap; }
.frow .fl { font-family: var(--mono); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); width: 100%; }
.fb { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: .7rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); }
.fb:hover { border-color: var(--line-2); color: var(--text); }
.fb[aria-pressed="true"] { background: var(--surface-3); border-color: var(--text-2); color: var(--text); }
.fb:focus-visible { outline: 2px solid #fff; }
.fb i { width: 7px; height: 7px; border-radius: 50%; }
.fb .n { font-family: var(--mono); color: var(--text-3); }
.count { display: flex; justify-content: space-between; font-size: .7rem; color: var(--text-3); font-family: var(--mono); padding: 4px 2px 8px; border-bottom: 1px solid var(--line); }
.count button { all: unset; cursor: pointer; color: #9cbcff; }
.list { overflow-y: auto; margin: 0 -6px; padding: 6px; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; height: max(520px, calc(100vh - 160px)); max-height: 820px; }
@media (max-width: 980px) { .list { height: auto; max-height: 520px; } }
.item { all: unset; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 9px 10px; border-radius: 11px; width: 100%; box-sizing: border-box; border: 1px solid transparent; transition: background .15s, border-color .15s; }
.item:hover { background: rgba(255,255,255,.04); }
.item[aria-selected="true"] { background: linear-gradient(90deg, rgba(69,137,255,.16), rgba(69,137,255,.03)); border-color: rgba(69,137,255,.45); }
.item:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }
.item .id { font-family: var(--mono); font-size: .78rem; font-weight: 600; }
.item .rk { font-family: var(--mono); font-size: .72rem; color: var(--text-3); text-align: right; }
.item .pr { font-size: .72rem; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.empty { color: var(--text-3); font-size: .8rem; padding: 18px 8px; }

.case { padding: 0; overflow: hidden; min-width: 0; }
.case-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); position: relative; }
.case-head::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--band, var(--bad)); box-shadow: 0 0 20px var(--band, var(--bad)); }
.case-top { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: start; }
.case-id { font-family: var(--mono); font-size: clamp(1.3rem, 2.6vw, 1.8rem); font-weight: 500; letter-spacing: -.01em; }
.case-prod { color: var(--text-2); font-size: .95rem; margin-top: 2px; }
.case-nav { display: flex; gap: 6px; align-items: center; }
.iconbtn { all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; border: 1px solid var(--line-2); color: var(--text-2); }
.iconbtn:hover { color: var(--text); background: var(--surface-3); }
.iconbtn:focus-visible { outline: 2px solid #fff; }
.case-pos { font-family: var(--mono); font-size: .7rem; color: var(--text-3); padding: 0 6px; }
.facts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.desc { margin-top: 14px; color: var(--text-2); font-size: .86rem; max-width: 92ch; }
.desc small { display: block; color: var(--text-3); font-size: .68rem; margin-top: 6px; font-family: var(--mono); }

.tabs { display: flex; gap: 4px; padding: 10px 16px 0; border-bottom: 1px solid var(--line); position: relative; overflow-x: auto; scrollbar-width: none; }
.tabs button { all: unset; cursor: pointer; padding: 10px 14px 12px; display: grid; gap: 1px; color: var(--text-3); white-space: nowrap; }
.tabs button b { font-weight: 500; font-size: .86rem; }
.tabs button span { font-family: var(--mono); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; }
.tabs button[aria-selected="true"] { color: var(--text); }
.tabs button:hover { color: var(--text-2); }
.tabs button:focus-visible { outline: 2px solid #fff; outline-offset: -4px; border-radius: 8px; }
.tabs .ink { position: absolute; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--s1), var(--s3)); border-radius: 2px; transition: left .45s var(--ease), width .45s var(--ease); }
.tabpanel { padding: 22px 24px 26px; animation: rise .45s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
[hidden] { display: none !important; }
.unk-v { color: var(--warn); }
.unk-note { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px; padding: 10px 12px; border-radius: 12px; border: 1px dashed rgba(241,194,27,.45); background: rgba(241,194,27,.06); font-size: .78rem; color: var(--text-2); }
.unk-note .badge { flex: none; }
.pnote { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px; color: var(--text-3); font-size: .76rem; }

.ladder { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px 6px; background: rgba(255,255,255,.015); }
.ladder-title { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.ladder-title strong { font-weight: 400; font-size: 1.02rem; }
.ladder-title strong b { font-family: var(--mono); font-weight: 600; }
.ladder-title span { font-size: .72rem; color: var(--text-3); }
#ladderSvg { display: block; width: 100%; height: 150px; overflow: visible; }
#ladderSvg .zone { fill: rgba(66,190,101,.08); }
#ladderSvg .cut { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 3 4; }
#ladderSvg .lane { stroke: var(--line); }
#ladderSvg .lab { font-family: var(--sans); font-size: 11.5px; fill: var(--text-2); }
#ladderSvg .tick text { font-family: var(--mono); font-size: 10px; fill: var(--text-3); }
#ladderSvg .tick line { stroke: var(--line); }
#ladderSvg .mk { transition: transform .9s var(--ease); }
#ladderSvg .mk text { font-family: var(--mono); font-size: 10.5px; fill: var(--text); }
#ladderSvg .gapline { stroke: var(--bad); stroke-width: 2; stroke-dasharray: 2 4; transition: x2 .9s var(--ease), x1 .9s var(--ease); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; margin-top: 14px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.box { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; background: rgba(255,255,255,.015); min-width: 0; }
.box h4 { font-family: var(--mono); font-size: .64rem; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.flags { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.flag { border-radius: 10px; padding: 9px 8px; text-align: center; border: 1px solid var(--line); font-size: .66rem; color: var(--text-3); display: grid; gap: 2px; }
.flag b { font-family: var(--mono); font-size: .72rem; font-weight: 600; color: var(--text); }
.flag.yes { border-color: rgba(66,190,101,.55); background: rgba(66,190,101,.1); } .flag.yes b { color: var(--good); }
.flag.no b { color: var(--text-2); }
.flag.unk { border-color: rgba(241,194,27,.5); background: var(--hatch); } .flag.unk b { color: var(--warn); }
.sigrow { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; font-size: .78rem; color: var(--text-2); }
.sigrow b { font-family: var(--mono); color: var(--text); font-weight: 500; }
.unk-note { margin-top: 10px; font-size: .76rem; color: var(--warn); display: flex; gap: 8px; align-items: start; }

.factors { display: grid; gap: 7px; }
.fx { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: .78rem; color: var(--text-2); }
.fx .ar { font-family: var(--mono); font-size: .8rem; }
.fx.dn .ar { color: var(--bad); } .fx.up .ar { color: var(--good); }
.fx .vv { font-family: var(--mono); font-size: .68rem; color: var(--text-3); white-space: nowrap; text-align: right; }
.fx .vv b { color: var(--text); font-weight: 500; }
.fsub { font-family: var(--mono); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); margin: 10px 0 4px; }
.fsub:first-child { margin-top: 0; }
.approx { margin-top: 10px; font-size: .72rem; color: var(--warn); }

.gchips { display: flex; gap: 6px; flex-wrap: wrap; }
.gchips .chip.unk { border-color: rgba(241,194,27,.55); color: var(--warn); background: var(--hatch); }
.peers { display: grid; gap: 8px; }
.peer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; font-size: .76rem; }
.peer .pg { color: var(--text-2); }
.peer .pg em { font-style: normal; color: var(--text); font-family: var(--mono); font-size: .72rem; }
.peer .pv { font-family: var(--mono); font-size: .72rem; color: var(--text); text-align: right; }
.peer .pv span { color: var(--text-3); }
.peer .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--surface-3); overflow: hidden; display: flex; }
.peer .bar i { display: block; height: 100%; }
.small { font-size: .7rem; color: var(--text-3); margin-top: 8px; }
.reading { display: flex; gap: 6px; flex-wrap: wrap; }
.reading .chip b { color: var(--text); font-weight: 500; }
details.more { margin-top: 14px; }
details.more summary { cursor: pointer; font-size: .76rem; color: var(--text-3); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+"; font-family: var(--mono); color: var(--s1); }
details.more[open] summary::before { content: "−"; }
details.more ul { margin: 10px 0 0; padding-left: 18px; color: var(--text-2); font-size: .78rem; display: grid; gap: 4px; }

.hyps { display: grid; gap: 12px; }
.hyp { border: 1px solid var(--line); border-left: 3px solid var(--cat); border-radius: 14px; padding: 14px 16px; background: linear-gradient(90deg, color-mix(in srgb, var(--cat) 7%, transparent), transparent 60%); animation: rise .5s var(--ease) both; }
.hyp-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.cat { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--cat); display: inline-flex; gap: 6px; align-items: center; }
.cat i { width: 7px; height: 7px; border-radius: 50%; background: var(--cat); }
.conf { display: inline-flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: .62rem; color: var(--text-3); letter-spacing: .08em; text-transform: uppercase; }
.conf .m { display: inline-flex; gap: 2px; }
.conf .m i { width: 12px; height: 5px; border-radius: 2px; background: var(--surface-3); }
.conf .m i.on { background: var(--text-2); }
.hyp p.h { font-size: .92rem; line-height: 1.45; }
.ev { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
.ev span { font-size: .66rem; color: var(--text-2); border: 1px dashed var(--line-2); border-radius: 6px; padding: 2px 7px; }
.check { margin-top: 10px; font-size: .78rem; color: var(--text-2); display: grid; grid-template-columns: auto 1fr; gap: 8px; }
.check b { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: #9cbcff; padding-top: 2px; }

.lessons { display: grid; gap: 14px; }
.lesson { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: var(--glass); animation: rise .5s var(--ease) both; }
.lesson .num { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--mono); font-weight: 600; color: #fff; background: linear-gradient(140deg, rgba(69,137,255,.55), rgba(165,110,255,.45)); box-shadow: 0 8px 24px -10px rgba(69,137,255,.8); }
.lesson .sign { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--warn); }
.lesson .signt { font-size: .82rem; color: var(--text-2); margin-top: 2px; }
.lesson .do { font-size: 1rem; line-height: 1.42; margin-top: 10px; font-weight: 400; color: var(--text); }
.lesson .why { font-size: .78rem; color: var(--text-2); margin-top: 8px; }
.lesson .lim { font-size: .74rem; color: var(--text-3); margin-top: 8px; display: flex; gap: 6px; }
.caveats { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.caveats h4 { font-family: var(--mono); font-size: .62rem; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); margin-bottom: 8px; }
.caveats ul { margin: 0; padding-left: 18px; color: var(--text-3); font-size: .76rem; display: grid; gap: 4px; }
.record { padding: 10px 24px 14px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: .62rem; color: var(--text-3); display: flex; gap: 14px; flex-wrap: wrap; }

.spots { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.spot { all: unset; cursor: pointer; display: grid; gap: 1px; padding: 9px 13px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); transition: border-color .15s, transform .15s; }
.spot:hover { border-color: var(--line-2); transform: translateY(-2px); }
.spot:focus-visible { outline: 2px solid #fff; }
.spot b { font-size: .76rem; font-weight: 500; }
.spot span { font-family: var(--mono); font-size: .66rem; color: var(--text-3); }

footer { padding: 34px 0 120px; color: var(--text-3); font-size: .72rem; font-family: var(--mono); }

/* dock */
.dock { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 40; display: flex; gap: 3px; padding: 5px; border-radius: 16px;
  background: rgba(18,18,25,.74); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); border: 1px solid var(--line-2);
  box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06); max-width: calc(100vw - 20px); overflow-x: auto; }
.dock a, .dock button { all: unset; cursor: pointer; border-radius: 11px; color: var(--text-2); padding: 8px 14px 7px; display: grid; gap: 1px; justify-items: center; min-width: 70px; }
.dock a:hover, .dock button:hover { background: rgba(255,255,255,.06); color: var(--text); }
.dock a.on { background: rgba(255,255,255,.08); color: var(--text); }
.dock a:focus-visible, .dock button:focus-visible { outline: 2px solid #fff; }
.dock b { font-weight: 500; font-size: .74rem; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.dock i.sub { font-style: normal; color: var(--text-3); font-size: .62rem; font-family: var(--mono); }
@media (max-width: 620px) {
  .dock { max-width: calc(100vw - 16px); }
  .dock a, .dock button { min-width: 0; padding: 8px 9px 7px; }
  .dock i.sub { display: none; }
}
.dock .tour { background: linear-gradient(140deg, rgba(69,137,255,.35), rgba(165,110,255,.3)); color: var(--text); }
.dock .tour[aria-pressed="true"] { background: linear-gradient(140deg, rgba(250,77,86,.45), rgba(165,110,255,.3)); }
.tourbar { position: fixed; left: 0; top: 0; height: 3px; background: linear-gradient(90deg, var(--s1), var(--s3), var(--bad)); z-index: 50; width: 0; transition: width .3s linear; }

.reveal { opacity: 0; transform: translateY(18px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
.reveal.in { opacity: 1; transform: none; }
.loading { padding: 80px 0; text-align: center; color: var(--text-3); font-family: var(--mono); }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
}

/* ===== skin: flat panels and ink-filled controls, matching the team's other pages ===== */
body { background: var(--bg); }
a { color: var(--ibm); }
:focus-visible, .legend button:focus-visible, .gap:focus-visible, .item:focus-visible, .fb:focus-visible, .iconbtn:focus-visible, .spot:focus-visible,
.tabs button:focus-visible, .dock a:focus-visible, .dock button:focus-visible, .stack button:focus-visible { outline-color: var(--ibm); }
.glow { background: var(--bg); }
.dots { opacity: 1; background-image: radial-gradient(var(--grid) 1.2px, transparent 1.3px); mask-image: none; inset: -2% -2% -2% -2%; animation: drift 90s linear infinite; }
header.bar { background: color-mix(in srgb, var(--bg) 86%, transparent); }
.brand .mk { width: 9px; height: 9px; border-radius: 2px; background: var(--ibm); box-shadow: none; animation: none; }
.brand b, .hero h1, .sec-head h2, .readout b, .kpi b, .vs .big, .ph h3 { font-family: var(--display); font-stretch: 78%; font-weight: 800; letter-spacing: -.003em; }
.brand b { text-transform: uppercase; letter-spacing: .06em; font-size: 1.05rem; }
.brand b em { font-style: normal; color: var(--alert); }
.brand span { color: var(--muted); }
.readout b { font-size: 1.5rem; line-height: 1; text-shadow: none !important; }
.readout b.g { color: var(--ok); } .readout b.r { color: var(--alert); }
.themebtn { font-size: .9rem; width: 34px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid; place-items: center; }
.themebtn:hover { border-color: var(--ink); }
@media (max-width: 760px) { .themebtn { margin-left: auto; } }
@media (max-width: 560px) { .brand > span:not(.mk) { display: none; } .brand b { font-size: .92rem; white-space: nowrap; } }
.prog { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--ibm); }
.eyebrow { color: var(--muted); }
.eyebrow .ibmtag { color: var(--ibm); border: 1px solid var(--ibm); border-radius: 4px; padding: 0 6px; }
.hero h1 { font-size: clamp(2.5rem, 5.8vw, 4.2rem); line-height: .95; margin-top: 14px; max-width: 17ch; }
.hero h1 b { color: var(--alert); font-weight: 800; }
.hero .lead { color: var(--muted); font-size: 1rem; }
.sec-head h2 { font-size: clamp(1.8rem, 3.2vw, 2.4rem); line-height: 1; max-width: 26ch; }
.sec-head h2 b { font-weight: 800; color: var(--ibm); }
.ph h3 { font-size: 1.25rem; line-height: 1.05; }
.panel { background: var(--panel); box-shadow: none; border-radius: 12px; }
.badge.ver { color: var(--ok); border-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, transparent); }
.badge.ai { color: var(--violet); border-color: var(--violet); background: color-mix(in srgb, var(--violet) 9%, transparent); }
.badge.unk { color: var(--warn); border-color: var(--warn); }
.chip { background: var(--region); }
.keyread .kr, .budget div, .cohort-ai .ta, .box, .ladder, .spot { background: var(--region); }
.keyread .kr { border-radius: 10px; }
#depthSvg .zone, #ladderSvg .zone { fill: color-mix(in srgb, var(--ok) 11%, transparent); }
#depthSvg circle.pt { stroke: var(--panel); }
#depthSvg circle.pt:hover, #depthSvg circle.pt.sel { stroke: var(--ink); }
#depthSvg circle.pt:focus-visible { stroke: var(--ink); }
#depthSvg .halo { stroke: var(--ink); }
.xh { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0; pointer-events: none; transition: opacity .15s; }
.xht { font-family: var(--mono); font-size: 10.5px; fill: var(--ink); opacity: 0; pointer-events: none; transition: opacity .15s; }
#depthSvg.hot .xh { opacity: .55; } #depthSvg.hot .xht { opacity: 1; }
#depthSvg .zone { transform-box: fill-box; transform-origin: left center; animation: wipe 1.1s var(--ease) both; }
#depthSvg .zoneline { stroke-dashoffset: 400; animation: dash 1.2s var(--ease) .15s forwards; stroke-dasharray: 3 4; }
@keyframes wipe { from { transform: scaleX(0); } }
@keyframes dash { to { stroke-dashoffset: 0; } }
.tip { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); backdrop-filter: none; }
.db .dot { border-color: var(--panel); }
.db .dot.c, .db .dot.m { box-shadow: none; }
.stack .s-code { background: color-mix(in srgb, var(--ok) 20%, var(--panel)); color: var(--ok); }
.stack .s-zero { background: color-mix(in srgb, var(--alert) 15%, var(--panel)); color: var(--alert); }
.stack .s-unk { background: var(--hatch), var(--warn-soft); color: var(--warn); }
.gap:hover, .item:hover, .dock a:hover, .dock button:hover { background: var(--wash); }
.item { animation: rise .4s var(--ease) both; animation-delay: calc(var(--k, 0) * 16ms); }
.item[aria-selected="true"] { background: var(--ibm-soft); border-color: var(--ibm); }
.fb[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.fb[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.count button { color: var(--ibm); }
.case-head::after { box-shadow: none; }
.tabs .ink { background: var(--ibm); }
.iconbtn:hover { background: var(--soft); color: var(--ink); }
.hyp { background-color: var(--panel); transition: transform .2s var(--ease), border-color .2s; }
.hyp:hover, .lesson:hover { transform: translateY(-2px); }
.check b { color: var(--ibm); }
.lesson { background: var(--panel); transition: transform .2s var(--ease); }
.lesson .num { background: var(--ink); color: var(--bg); box-shadow: none; }
.flag.yes { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 11%, transparent); }
.flag.unk { border-color: var(--warn); }
.unk-note { border-color: var(--warn); background: var(--warn-soft); color: var(--ink); }
.gchips .chip.unk { border-color: var(--warn); }
.spot { border-radius: 10px; }
.spot:hover { border-color: var(--ibm); }
.dock { background: color-mix(in srgb, var(--panel) 90%, transparent); box-shadow: var(--shadow); border-radius: 999px; padding: 4px; }
.dock a, .dock button { border-radius: 999px; }
.dock a.on { background: var(--ink); color: var(--bg); }
.dock a.on i.sub { color: inherit; opacity: .7; }
.dock .tour { background: var(--ibm); color: #fff; }
.dock .tour[aria-pressed="true"] { background: var(--alert); color: #fff; }
.dock .tour i.sub { color: inherit; opacity: .8; }
.tourbar { background: var(--ibm); }

/* headline numbers: each one filters the case files */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 26px; }
@media (max-width: 820px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { appearance: none; font: inherit; color: inherit; text-align: left; box-sizing: border-box; cursor: pointer; display: grid; gap: 4px; align-content: start; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); transition: opacity .8s var(--ease), transform .35s var(--ease), border-color .2s; }
.kpi:hover { transform: translateY(-2px); border-color: var(--ibm); }
.kpi:focus-visible { outline: 2px solid var(--ibm); outline-offset: 2px; }
.kpi b { font-size: 2.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi.bad b { color: var(--alert); }
.kpi span { font-size: .8rem; color: var(--muted); line-height: 1.3; }
.kpi small { font-family: var(--mono); font-size: .62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--text-3); }
.kpi small::after { content: " →"; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 0 0 16px; }
@media (max-width: 760px) { .steps { grid-template-columns: minmax(0, 1fr); } }
.steps div { display: flex; gap: 10px; align-items: center; font-size: .78rem; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; background: var(--panel); }
.steps b { font-family: var(--mono); font-size: .7rem; color: var(--ibm); border: 1px solid var(--ibm); border-radius: 99px; padding: 0 7px; }
</style>

<div class="glow"></div><div class="dots"></div>
<div class="tourbar" id="tourbar"></div>
<div class="tip" id="tip" role="tooltip"></div>

<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="#top"><span class="mk"></span><b>Blind Spot <em>Investigator</em></b><span>Before the Breach</span></a>
    <div class="readout" aria-label="Historical result">
      <div><b data-count="total_cves">0</b><i>CVEs ranked</i></div>
      <div><b data-count="review_cutoff">0</b><i>reviewed</i></div>
      <div><b class="g" data-count="caught">0</b><i>exploits caught</i></div>
      <div><b class="r" data-count="missed">0</b><i>exploits missed</i></div>
    </div>
    <button type="button" class="themebtn" id="themeBtn" aria-label="Toggle light or dark theme">◐</button>
  </div>
  <div class="prog" id="prog"></div>
</header>

<main id="top">
  <div id="app"><p class="loading">Loading investigations…</p></div>
</main>

<nav class="dock" aria-label="Sections">
  <a href="#overview" data-sec="overview"><b>The line</b><i class="sub">75 exploits</i></a>
  <a href="#anatomy" data-sec="anatomy"><b>Patterns</b><i class="sub">what differed</i></a>
  <a href="#cases" data-sec="cases"><b>Case files</b><i class="sub">43 misses</i></a>
  <button class="tour" id="tourBtn" aria-pressed="false"><b>▶ Tour</b><i class="sub">5 cases</i></button>
</nav>

<script>
(function () {
  "use strict";
  var DATA_URL = "../feature/output/dashboard_investigations.json";
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var NS = "http://www.w3.org/2000/svg";

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function fmt(n) { return Number(n).toLocaleString("en-US"); }
  function pct(v) { return Math.round(v * 100) + "%"; }
  function words(s) { return String(s || "").replace(/_/g, " "); }

  var ICON = {
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8.5l3 3 7-7"/></svg>',
    spark: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0l1.6 5.2L15 7l-5.4 1.8L8 14l-1.6-5.2L1 7l5.4-1.8z"/></svg>',
    q: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6.5"/><path d="M6 6.2a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9v.6M8 11.6v.1"/></svg>',
    prev: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 3L5 8l5 5"/></svg>',
    next: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg>',
    search: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" style="color:var(--text-3)"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>'
  };
  var BADGE = {
    ver: '<span class="badge ver">' + ICON.check + 'Verified fact</span>',
    ai: '<span class="badge ai">' + ICON.spark + 'AI explanation</span>',
    ail: '<span class="badge ai">' + ICON.spark + 'AI advice</span>',
    unk: '<span class="badge unk">' + ICON.q + 'Unknown</span>'
  };

  var BANDS = {
    near_miss_518_to_1000: { key: "near", label: "Near miss", range: "518–1,000", color: "var(--near)" },
    mid_miss_1001_to_5000: { key: "mid", label: "Mid miss", range: "1,001–5,000", color: "var(--mid)" },
    deep_miss_over_5000: { key: "deep", label: "Deep miss", range: "over 5,000", color: "var(--deep)" }
  };
  var CATS = {
    observable_signal: { label: "Visible warning sign", color: "var(--c-signal)" },
    information_gap: { label: "Missing information", color: "var(--c-gap)" },
    model_disagreement: { label: "Models disagreed", color: "var(--c-dis)" },
    data_quality: { label: "Data problem", color: "var(--c-dq)" }
  };
  var GAPS = {
    no_signal_row: "Not tracked by exploit databases (status unknown)",
    no_recorded_exploit_code: "Tracked, but no exploit code listed yet",
    kev_soon_after_snapshot: "Confirmed exploited within a month of being scored",
    vendor_no_prior_kev: "Vendor had no earlier confirmed exploits",
    cwe_broad: "Vague, catch-all weakness type (CWE)",
    cwe_unknown: "Weakness type unknown",
    cvss_missing: "No severity score (CVSS) yet",
    epss_missing: "No exploit-likelihood score (EPSS) yet",
    granite_product_type_possible_mismatch: "Granite AI may have mislabelled the product type"
  };
  var MODELS = { "Logistic regression": { short: "LR", color: "var(--m-lr)" }, "Granite LoRA": { short: "LoRA", color: "var(--m-lora)" }, "LightGBM": { short: "LGBM", color: "var(--m-lgbm)" } };
  var FLAGS = [["exploitdb", "Exploit-DB"], ["metasploit", "Metasploit"], ["nuclei", "Nuclei"], ["poc_github", "GitHub PoC"]];
  var PEERS = [["same_product_type", "Same product type"], ["same_vendor", "Same vendor"], ["same_signal_state", "Same signal state"]];
  var SIGSTATE = { code: "Exploit code found", zero: "No exploit code found", unk: "Not tracked (unknown)" };

  var D, CASES = [], TOTAL, CUT, sel = 0, tab = 0;
  var filt = { band: null, sig: null, cat: null, gap: null, q: "" };

  function signalState(c) {
    var s = c.verified_evidence.snapshot_signals;
    if (!s.monthly_signal_row_present) return "unk";
    var f = s.exploit_code_flags || {};
    return FLAGS.some(function (k) { return f[k[0]]; }) ? "code" : "zero";
  }
  function logPos(r) { return Math.log10(Math.max(1, r)) / Math.log10(TOTAL); }
  function bandOf(c) { return BANDS[c.ranking.miss_band] || BANDS.deep_miss_over_5000; }
  function cats(c) { var o = {}; c.ai_analysis.possible_explanations.forEach(function (h) { o[h.category] = 1; }); return o; }
  function gapCodes(c) { return c.verified_evidence.information_gaps.map(function (g) { return g.code; }); }

  fetch(DATA_URL).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(init).catch(function (e) {
    $("#app").innerHTML = '<div class="wrap"><p class="loading">Could not load ' + esc(DATA_URL) + " (" + esc(e.message) + ").<br>Serve the Amy folder over http: python -m http.server 8770 --directory Amy</p></div>";
  });

  function init(data) {
    D = data; CASES = data.investigations.slice(); TOTAL = data.meta.total_cves; CUT = data.meta.review_cutoff;
    CASES.forEach(function (c, i) { c._i = i; c._sig = signalState(c); c._cats = cats(c); c._gaps = gapCodes(c); });
    $("#app").innerHTML = viewOverview() + viewAnatomy() + viewCases();
    countUp();
    drawDepth();
    fillAnatomy();
    renderFilters(); renderList(); select(0, false, true);
    wire();
    observe();
    var h = decodeURIComponent(location.hash.slice(1));
    var hit = CASES.findIndex(function (c) { return c.id === h; });
    if (hit >= 0) { select(hit, true, true); setTimeout(function () { $("#cases").scrollIntoView(); }, 50); }
    window.__BSI = { loaded: CASES.length, caught: D.caught_context.length };
  }

  /* ------------------------------------------------ overview */
  function viewOverview() {
    var m = D.meta;
    return '<section id="overview" class="hero"><div class="wrap">' +
      '<div class="hero-top"><div>' +
      '<div class="eyebrow"><span class="ibmtag">IBM</span><span>Before the Breach · Sheridan Datathon 2026</span></div>' +
      '<h1><b>' + m.missed + ' confirmed exploits</b> fell below the review line.</h1>' +
      '<p class="lead">The model ranked ' + fmt(m.total_cves) + ' vulnerabilities (CVEs) from 2024–2025 by how likely they were to be exploited. Analysts only have time to review the top ' + fmt(m.review_cutoff) + '. Later, ' + m.kev_positives + ' of these CVEs were confirmed as exploited by attackers (added to CISA\'s Known Exploited Vulnerabilities list, or KEV). The model had put ' + m.caught + ' of them in the top ' + fmt(m.review_cutoff) + '. This page looks at the other ' + m.missed + ': where each one ranked, what the data showed at the time, possible reasons it was missed, and what to watch for next time. It only looks back at past data. It does not predict future attacks.</p>' +
      '</div><div class="keyread">' +
      '<div class="kr">' + BADGE.ver + '<p>Ranks, exploit records, model scores and how similar CVEs turned out. All calculated directly from the data.</p></div>' +
      '<div class="kr">' + BADGE.ai + '<p>Possible reasons and advice written by AI from those facts. They are informed guesses, not proven causes.</p></div>' +
      '<div class="kr">' + BADGE.unk + '<p>Some CVEs were never tracked by exploit databases. For those, we don\'t know whether exploit code existed.</p></div>' +
      '</div></div>' +
      '<div class="panel depth reveal"><div class="depth-head"><strong>Where each of the ' + m.kev_positives + ' exploited CVEs ranked</strong><span>Rank 1 is the model\'s top pick · CVEs left of the line were reviewed · click any missed dot to open its case</span></div>' +
      '<div class="legend" id="depthLegend">' +
      '<span style="display:inline-flex;gap:6px;align-items:center;padding:2px 8px"><i style="background:var(--good)"></i>Caught · ' + m.caught + '</span>' +
      Object.keys(BANDS).map(function (k) { var b = BANDS[k]; var n = CASES.filter(function (c) { return c.ranking.miss_band === k; }).length; return '<button data-band="' + b.key + '" aria-pressed="false"><i style="background:' + b.color + '"></i>' + b.label + ' ' + b.range + ' · ' + n + '</button>'; }).join("") +
      '</div><svg id="depthSvg" role="img" aria-label="Ranks of the 75 exploited CVEs: 32 inside the top 517, 43 outside"></svg></div>' +
      kpiRow() +
      '</div></section>';
  }
  function kpiRow() {
    var n = CASES.length, near = CASES.filter(function (c) { return bandOf(c).key === "near"; }).length, deep = CASES.filter(function (c) { return bandOf(c).key === "deep"; }).length;
    var x5 = CASES.filter(function (c) { return c.ranking.ensemble_rank <= CUT * 5; }).length;
    var k = function (cls, num, label, act, hint) { return '<button class="kpi reveal ' + cls + '" data-act="' + act + '"><b data-num="' + num + '">0</b><span>' + label + '</span><small>' + hint + '</small></button>'; };
    return '<div class="kpis">' +
      k("bad", n, "of the " + D.meta.kev_positives + " exploited CVEs were never reviewed", "all", "see all " + n) +
      k("", near, "just missed the cut, ranked 518 to 1,000", "near", "see these") +
      k("", x5, "of the " + n + " would have been reviewed if analysts checked five times as many CVEs (the top " + fmt(CUT * 5) + ")", "x5", "see these") +
      k("bad", deep, "ranked below 5,000, far from the cut", "deep", "see these") + '</div>';
  }

  var depthDrawn = false, DEPTH = null;
  function drawDepth() {
    var svg = $("#depthSvg"); if (!svg) return;
    var animate = !REDUCED && !depthDrawn; depthDrawn = true;
    var W = svg.clientWidth || 1000, H = 250, padL = 18, padR = 18, axisY = H - 34, mid = (axisY - 14) / 2 + 8, R = 6;
    var x = function (r) { return padL + logPos(r) * (W - padL - padR); };
    var pts = D.caught_context.map(function (c) { return { r: c.ensemble_rank, id: c.cve_id, prod: [c.vendor, c.product].filter(Boolean).join(" "), caught: true }; })
      .concat(CASES.map(function (c) { return { r: c.ranking.ensemble_rank, id: c.id, prod: [c.vulnerability.vendor, c.vulnerability.product].filter(Boolean).join(" "), caught: false, c: c }; }))
      .sort(function (a, b) { return a.r - b.r; });
    var placed = [];
    pts.forEach(function (p) {
      p.x = x(p.r);
      for (var k = 0; k < 40; k++) {
        var off = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (R * 2 + 1.5), y = mid + off;
        if (!placed.some(function (q) { return Math.abs(q.x - p.x) < R * 2 + 1 && Math.abs(q.y - y) < R * 2 + 1; })) { p.y = y; break; }
      }
      if (p.y == null) p.y = mid; placed.push(p);
    });
    var cx = x(CUT), s = "";
    s += '<rect class="zone" x="' + padL + '" y="4" width="' + (cx - padL) + '" height="' + (axisY - 4) + '" rx="8"/>';
    s += '<line class="zoneline" x1="' + cx + '" x2="' + cx + '" y1="4" y2="' + axisY + '"/>';
    s += '<text class="zl" x="' + (cx - 8) + '" y="18" text-anchor="end">REVIEWED · TOP ' + CUT + '</text>';
    s += '<text class="zr" x="' + (cx + 8) + '" y="18">NOT REVIEWED →</text>';
    s += '<line class="axis" x1="' + padL + '" x2="' + (W - padR) + '" y1="' + axisY + '" y2="' + axisY + '"/>';
    [1, 10, 100, CUT, 1000, 10000, TOTAL].forEach(function (t) {
      s += '<g class="tick"><line x1="' + x(t) + '" x2="' + x(t) + '" y1="' + axisY + '" y2="' + (axisY + 5) + '"/><text x="' + x(t) + '" y="' + (axisY + 18) + '" text-anchor="' + (t === 1 ? "start" : t === TOTAL ? "end" : "middle") + '"' + (t === CUT ? ' style="fill:var(--good)"' : "") + '>' + fmt(t) + '</text></g>';
    });
    pts.forEach(function (p, i) {
      var col = p.caught ? "var(--good)" : bandOf(p.c).color;
      var band = p.caught ? "caught" : bandOf(p.c).key;
      s += '<circle class="pt ' + (p.caught ? "caught" : "miss") + '" data-band="' + band + '" ' + (p.caught ? "" : 'data-i="' + p.c._i + '" tabindex="0" role="button" aria-label="Open ' + p.id + ', rank ' + fmt(p.r) + '"') +
        ' data-tip="' + esc(p.id) + '|' + esc(p.prod) + '|' + (p.caught ? "Caught · rank " + fmt(p.r) : "Missed · rank " + fmt(p.r) + " · " + fmt(p.r - CUT) + " below the line") + '"' +
        ' cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + R + '" fill="' + col + '" style="' + (animate ? "opacity:0;transform:translateY(" + -(p.y + 30) + "px);transition-delay:" + (300 + i * 18) + "ms" : "") + '"/>';
    });
    s += '<circle class="halo" id="depthHalo" r="8" cx="-50" cy="-50"/>';
    s += '<line class="xh" id="xh" x1="0" x2="0" y1="4" y2="' + axisY + '"/><text class="xht" id="xht" x="0" y="' + (axisY + 30) + '" text-anchor="middle"></text>';
    DEPTH = { W: W, padL: padL, padR: padR, axisY: axisY };
    svg.innerHTML = s;
    if (animate) requestAnimationFrame(function () { requestAnimationFrame(function () {
      $$("#depthSvg circle.pt").forEach(function (c) { c.style.opacity = ""; c.style.transform = "none"; });
      setTimeout(function () { $$("#depthSvg circle.pt").forEach(function (c) { c.style.transitionDelay = ""; }); }, 2600);
    }); });
    markDepth();
  }
  function markDepth() {
    var c = CASES[sel], h = $("#depthHalo"); if (!h || !c) return;
    $$("#depthSvg circle.pt.sel").forEach(function (e) { e.classList.remove("sel"); });
    var dot = $('#depthSvg circle.pt[data-i="' + c._i + '"]');
    if (dot) { dot.classList.add("sel"); h.setAttribute("cx", dot.getAttribute("cx")); h.setAttribute("cy", dot.getAttribute("cy")); }
  }

  /* ------------------------------------------------ anatomy */
  function viewAnatomy() {
    var co = D.cohort, ve = co.verified_evidence, dis = ve.model_disagreement_test;
    var deltas = dis.deltas_vs_expanded_ensemble || {};
    var lessons = co.ai_analysis.analyst_takeaways.slice(0, 3);
    return '<section id="anatomy" class="block"><div class="wrap">' +
      '<div class="sec-head reveal"><div><div class="eyebrow">01 · Why they were missed</div><h2>Most caught CVEs already had <b>public exploit code</b>. Most missed ones did not.</h2>' +
      '<p>A comparison of the 32 caught and 43 missed CVEs, using what was known in the month the model scored each one.</p></div>' + BADGE.ver + '</div>' +
      '<div class="anat">' +
      '<div class="panel span7 reveal"><div class="ph"><div><h3>What caught CVEs had that missed ones didn\'t</h3><p>The share of each group with each trait. These traits made the biggest difference to the scores in the logistic regression model.</p></div>' +
      '<div class="legend" style="margin:0"><span style="display:inline-flex;gap:6px;align-items:center"><i style="background:var(--good)"></i>caught</span><span style="display:inline-flex;gap:6px;align-items:center"><i style="background:var(--bad)"></i>missed</span></div></div><div class="dumb" id="dumb"></div></div>' +
      '<div class="panel span5 reveal"><div class="ph"><div><h3>Was exploit code known for the 43 misses?</h3><p>What public exploit databases (Exploit-DB, Metasploit, Nuclei, GitHub) showed in the month each CVE was scored. Click a bar to filter the cases.</p></div></div>' +
      '<div class="stack" id="sigStack"></div><div class="stack-key">' +
      '<div><i style="background:rgba(66,190,101,.5)"></i><span><b>Exploit code found.</b> Public exploit code existed, but the model still ranked these below the top 517.</span></div>' +
      '<div><i style="background:rgba(250,77,86,.45)"></i><span><b>No exploit code found.</b> The databases tracked the CVE, but no exploit code was listed yet.</span></div>' +
      '<div><i style="background:var(--warn);background-image:var(--hatch)"></i><span><b>Not tracked (unknown).</b> The databases had no entry for the CVE. The model treated this as "no exploit code", but nobody actually checked.</span></div></div></div>' +
      '<div class="panel span6 reveal"><div class="ph"><div><h3>Missing or weak information in the 43 cases</h3><p>Found automatically. A case can have more than one. Click one to filter the cases.</p></div></div><div class="gaps" id="gaps"></div></div>' +
      '<div class="panel span6 reveal"><div class="ph"><div><h3>Would it help to flag CVEs where the models disagree?</h3><p>We tested this. We flagged every CVE that only one of the three models ranked in its own top 517.</p></div></div>' +
      '<div class="verdict"><div class="vs"><div class="col"><span class="big r" data-num="' + dis.misses_with_a_single_model_inside_top_517 + '">0</span><span class="cap">missed exploits were flagged</span></div><span class="x">vs</span>' +
      '<div class="col"><span class="big mu" data-num="' + dis.non_confirmed_cves_with_a_single_model_inside_top_517 + '">0</span><span class="cap">CVEs that were never exploited were flagged too</span></div></div>' +
      '<p class="verdict-line">Reviewing the flagged CVEs <b>' + (dis.disagreement_watchlist_beats_expanded_ensemble ? "found more" : "did not find more") + '</b> exploits than simply reviewing further down the ranking.</p></div>' +
      '<div class="budget">' + Object.keys(deltas).map(function (k) { var v = deltas[k]; return '<div><b class="' + (v < 0 ? "neg" : v === 0 ? "zero" : "") + '">' + (v > 0 ? "+" : "") + v + '</b><span>' + k + ' MORE REVIEWS</span></div>'; }).join("") + '</div>' +
      '<p class="small">Each number is how many more exploits the flagged list found than reviewing the same number of extra CVEs from the ranking. Because flagging didn\'t help, model disagreement appears in the cases only as a weak hint.</p></div>' +
      '<details class="panel span12 reveal cohort-d"><summary><div><h3>General AI advice across all 43 misses</h3><p>Broad suggestions based on the whole group. Each case below has its own specific advice.</p></div>' + BADGE.ail + '</summary><div class="cohort-ai">' +
      lessons.map(function (l) { return '<div class="ta"><h4>' + esc(l.warning_sign) + '</h4><p>' + esc(l.what_to_investigate) + '</p><p class="lim">Caveat: ' + esc(l.limitation) + '</p></div>'; }).join("") +
      '</div></details>' +
      '</div></div></section>';
  }
  function fillAnatomy() {
    var ve = D.cohort.verified_evidence;
    var rows = ve.features_separating_missed_from_caught.filter(function (f) {
      return f.caught_mean_value >= 0 && f.caught_mean_value <= 1 && f.missed_mean_value >= 0 && f.missed_mean_value <= 1 && f.feature.indexOf("llm_") !== 0;
    }).slice(0, 7);
    $("#dumb").innerHTML = rows.map(function (f) {
      var a = f.missed_mean_value, b = f.caught_mean_value, lo = Math.min(a, b), hi = Math.max(a, b);
      return '<div class="db"><span class="l">' + esc(plain(f.meaning)) + '</span><span class="tr" data-lo="' + lo + '" data-hi="' + hi + '" data-c="' + b + '" data-m="' + a + '"><span class="seg" style="left:0;width:0"></span><span class="dot m" style="left:0"></span><span class="dot c" style="left:0"></span></span><span class="v"><b>' + pct(b) + '</b> vs <em>' + pct(a) + '</em></span></div>';
    }).join("");
    var n = { code: 0, zero: 0, unk: 0 }; CASES.forEach(function (c) { n[c._sig]++; });
    $("#sigStack").innerHTML = ["code", "zero", "unk"].map(function (k) {
      return '<button class="s-' + k + '" data-sig="' + k + '" data-w="' + (n[k] / CASES.length * 100) + '" aria-label="' + SIGSTATE[k] + ': ' + n[k] + ' cases. Filter case files"><b>' + n[k] + '</b>' + (n[k] / CASES.length < .3 ? "" : '<span>' + SIGSTATE[k] + '</span>') + '</button>';

      '<div class="lessons">' + c.ai_analysis.analyst_takeaways.map(function (l, k) {
        return '<div class="lesson" style="animation-delay:' + k * 80 + 'ms"><div class="num">' + (k + 1) + '</div><div><div class="sign">Warning sign in this case</div><div class="signt">' + esc(l.warning_sign) + '</div>' +
          '<p class="do">' + esc(l.what_to_investigate) + '</p><p class="why">' + esc(l.why_it_applies) + '</p><p class="lim"><span>⚠</span><span>' + esc(l.limitation) + '</span></p></div></div>';
      }).join("") + '</div>' +
      (c.ai_analysis.limitations && c.ai_analysis.limitations.length ? '<div class="caveats"><h4>Caveats for this case</h4><ul>' + c.ai_analysis.limitations.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul></div>' : "");
  }

  /* ------------------------------------------------ behaviour */
  function tween(el, to, ms) {
    if (REDUCED) { el.textContent = fmt(to); return; }
    var t0 = performance.now();
    (function step(t) { var k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(Math.round(to * e)); if (k < 1) requestAnimationFrame(step); })(t0);
  }
  function countUp() { $$("[data-count]").forEach(function (e) { tween(e, D.meta[e.dataset.count], 1400); }); }

  function observe() {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        e.target.classList.add("in");
        if (e.target.closest("#anatomy")) animateAnatomy(e.target);
        else $$("[data-num]", e.target).concat(e.target.hasAttribute("data-num") ? [e.target] : []).forEach(function (n) { tween(n, +n.dataset.num, 1100); });
        io.unobserve(e.target);
        setTimeout(function () { e.target.style.transitionDelay = ""; }, 1800);
      });
    }, { threshold: .18 });
    $$(".reveal").forEach(function (e, i) { e.style.transitionDelay = (e.classList.contains("kpi") ? $$(".kpi").indexOf(e) * 90 : 0) + "ms"; io.observe(e); });
    var secs = ["overview", "anatomy", "cases"].map(function (id) { return document.getElementById(id); });
    var so = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) $$(".dock a").forEach(function (a) { a.classList.toggle("on", a.dataset.sec === e.target.id); }); });
    }, { rootMargin: "-45% 0px -50% 0px" });
    secs.forEach(function (s) { if (s) so.observe(s); });
  }

  function step(d) {
    var v = visible(); if (!v.length) return;
    var p = v.indexOf(CASES[sel]); p = p < 0 ? 0 : (p + d + v.length) % v.length;
    select(v[p]._i);
  }
  function openCase(i) { select(+i); $("#cases").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth" }); }

  var tourT = null, tourIdx = 0, tourSteps = [];
  function tourStop() { clearTimeout(tourT); tourT = null; $("#tourBtn").setAttribute("aria-pressed", "false"); $("#tourBtn b").textContent = "▶ Tour"; $("#tourbar").style.width = "0"; }
  function tourNext() {
    if (tourIdx >= tourSteps.length) { tourStop(); return; }
    var st = tourSteps[tourIdx++];
    if (st.tab === 0) select(st.i);
    setTab(st.tab);
    $("#tourbar").style.width = (tourIdx / tourSteps.length * 100) + "%";
    tourT = setTimeout(tourNext, st.tab === 2 ? 7000 : 5500);
  }
  function tourStart() {
    tourSteps = []; spotlights().forEach(function (s) { [0, 1, 2].forEach(function (t) { tourSteps.push({ i: s.c._i, tab: t }); }); });
    tourIdx = 0; filt = { band: null, sig: null, cat: null, gap: null, q: "" }; $("#q").value = ""; renderFilters(); renderList();
    $("#tourBtn").setAttribute("aria-pressed", "true"); $("#tourBtn b").textContent = "■ Stop";
    $("#cases").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth" });
    setTimeout(tourNext, 500);
  }

  function wire() {
    var tip = $("#tip");
    document.addEventListener("mouseover", function (e) {
      var t = e.target.closest("[data-tip]"); if (!t) return;
      var p = t.dataset.tip.split("|"); tip.innerHTML = "<b>" + esc(p[0]) + "</b>" + (p[1] ? "<span>" + esc(p[1]) + "</span><br>" : "") + '<span style="color:var(--text-3)">' + esc(p[2]) + "</span>"; tip.classList.add("on");
    });
    document.addEventListener("mousemove", function (e) { if (!tip.classList.contains("on")) return; var x = Math.min(e.clientX + 14, innerWidth - 290); tip.style.left = x + "px"; tip.style.top = (e.clientY + 16) + "px"; });
    document.addEventListener("mouseout", function (e) { if (e.target.closest("[data-tip]")) tip.classList.remove("on"); });

    /* rank read-out that follows the pointer along the chart */
    document.addEventListener("mousemove", function (e) {
      var svg = $("#depthSvg"); if (!svg || !DEPTH) return;
      var r = svg.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
      var inside = px >= DEPTH.padL && px <= DEPTH.W - DEPTH.padR && py >= 0 && py <= r.height;
      svg.classList.toggle("hot", inside); if (!inside) return;
      var rank = Math.round(Math.pow(TOTAL, (px - DEPTH.padL) / (DEPTH.W - DEPTH.padL - DEPTH.padR)));
      var xh = $("#xh"), xt = $("#xht");
      xh.setAttribute("x1", px); xh.setAttribute("x2", px);
      xt.setAttribute("x", Math.max(40, Math.min(DEPTH.W - 40, px))); xt.textContent = "rank ~" + fmt(rank) + (rank <= CUT ? " · reviewed" : "");
    });
    $("#themeBtn").addEventListener("click", function () {
      var root = document.documentElement, cur = root.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"), next = cur === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next); try { localStorage.setItem("bsi-theme", next); } catch (err) {}
    });
    var prog = $("#prog");
    window.addEventListener("scroll", function () { var h = document.documentElement.scrollHeight - innerHeight; prog.style.width = (h > 0 ? scrollY / h * 100 : 0) + "%"; }, { passive: true });

    document.addEventListener("click", function (e) {
      var t;
      if ((t = e.target.closest(".kpi"))) {
        var a = t.dataset.act; tourStop();
        filt = { band: a === "near" || a === "deep" ? a : null, sig: null, cat: null, gap: null, q: "", max: a === "x5" ? CUT * 5 : null };
        $("#q").value = ""; renderFilters(); renderList(); $("#cases").scrollIntoView({ behavior: REDUCED ? "auto" : "smooth" });
        var v = visible(); if (v.length && v.indexOf(CASES[sel]) < 0) select(v[0]._i, true, true);
        return;
      }
      if ((t = e.target.closest("#depthSvg circle.miss"))) { tourStop(); openCase(t.dataset.i); return; }
      if ((t = e.target.closest("#depthLegend button"))) { filt.band = filt.band === t.dataset.band ? null : t.dataset.band; renderFilters(); renderList(); return; }
      if ((t = e.target.closest("#list .item"))) {
        tourStop(); select(+t.dataset.i, false);
        if (innerWidth <= 980) window.scrollTo({ top: $("#case").getBoundingClientRect().top + scrollY - 70, behavior: REDUCED ? "auto" : "smooth" });
        return;
      }
      if ((t = e.target.closest(".fb"))) { var g = t.dataset.g; filt[g] = filt[g] === t.dataset.v ? null : t.dataset.v; renderFilters(); renderList(); return; }
      if ((t = e.target.closest("#sigStack button"))) { filt.sig = t.dataset.sig; renderFilters(); renderList(); $("#cases").scrollIntoView({ behavior: "smooth" }); return; }
      if ((t = e.target.closest(".gap"))) { filt.gap = t.dataset.gap; renderList(); $("#cases").scrollIntoView({ behavior: "smooth" }); return; }
      if (e.target.closest("#clearF")) { filt = { band: null, sig: null, cat: null, gap: null, q: "" }; $("#q").value = ""; renderFilters(); renderList(); return; }
      if ((t = e.target.closest(".spot"))) { tourStop(); select(+t.dataset.i); setTab(0); return; }
      if ((t = e.target.closest(".tabs button"))) { tourStop(); setTab(+t.dataset.tab); return; }
      if (e.target.closest("#prevC")) { tourStop(); step(-1); return; }
      if (e.target.closest("#nextC")) { tourStop(); step(1); return; }
      if (e.target.closest("#tourBtn")) { tourT ? tourStop() : tourStart(); return; }
    });
    document.addEventListener("keydown", function (e) {
      var inField = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      if (e.key === "/" && !inField) { e.preventDefault(); $("#q").focus(); return; }
      if (e.key === "Escape" && tourT) { tourStop(); return; }
      if (inField) return;
      var dot = e.target.closest && e.target.closest("#depthSvg circle.miss");
      if (dot && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openCase(dot.dataset.i); return; }
      var inCases = $("#cases").getBoundingClientRect(); var vis = inCases.top < innerHeight * .6 && inCases.bottom > innerHeight * .3;
      if (!vis) return;
      if (e.key === "ArrowRight" || e.key === "ArrowDown" && e.target.closest("#list")) { e.preventDefault(); tourStop(); step(1); }
      else if (e.key === "ArrowLeft" || e.key === "ArrowUp" && e.target.closest("#list")) { e.preventDefault(); tourStop(); step(-1); }
      else if (e.key === "1" || e.key === "2" || e.key === "3") { tourStop(); setTab(+e.key - 1); }
    });
    $("#q").addEventListener("input", function (e) { filt.q = e.target.value; renderList(); });
    var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { drawDepth(); renderList(); drawLadder(CASES[sel]); moveInk(); }, 150); });
  }
})();
</script>
</html>

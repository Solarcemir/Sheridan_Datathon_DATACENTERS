<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEVexploit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one zoomable canvas. Overview = the whole machine (7 stage regions, 22 bubbles, every wire).
   Zooming into a region keeps its bubbles and wires: they shrink into the middle of the region, and the slide's
   insights appear around them as callouts. Technical detail sits behind the "details" buttons at the bottom. */
:root {
  --bg: #e9edf2; --panel: #ffffff; --ink: #0f1a2a; --muted: #586579; --line: #c3ccd8; --soft: #dde3eb; --grid: #d3dae4; --region: #f4f6f9;
  --ibm: #2b59e0; --ibm-soft: #e2e9fc; --alert: #c4302b; --alert-soft: #f8e2e0; --ok: #1d7f55; --no: #8a93a3;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --morph: .85s cubic-bezier(.65, 0, .35, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #070c13; --panel: #121c2a; --ink: #f2f6fb; --muted: #aebbd0; --line: #40536f; --soft: #1c2738; --grid: #1a2535; --region: #0d1520;
  --ibm: #8eaaff; --ibm-soft: #1c2b55; --alert: #ff7b70; --alert-soft: #45201f; --ok: #4cc58f; --no: #6c7789; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #070c13; --panel: #121c2a; --ink: #f2f6fb; --muted: #aebbd0; --line: #40536f; --soft: #1c2738; --grid: #1a2535; --region: #0d1520;
  --ibm: #8eaaff; --ibm-soft: #1c2b55; --alert: #ff7b70; --alert-soft: #45201f; --ok: #4cc58f; --no: #6c7789; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); overflow: hidden }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--ibm); outline-offset: 2px }

#stage { position: fixed; inset: 0; overflow: hidden; touch-action: manipulation;
  background-image: radial-gradient(var(--grid) 1.2px, transparent 1.3px); background-size: 26px 26px }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0 }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none }
.edge { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linecap: round; transition: d var(--morph), opacity .4s }
.edge.pulse { stroke: var(--ibm); stroke-dasharray: 2 13; animation: flow 1.7s linear infinite; opacity: .55; stroke-width: 2 }
.edge.dash { stroke-dasharray: 4 5 }
.edge.sat { stroke: var(--ibm); opacity: .45; stroke-width: 1 }
@keyframes flow { to { stroke-dashoffset: -30 } }

/* title on the canvas */
.title { position: absolute }
.title .brand { font-family: var(--f-display); font-stretch: 80%; font-weight: 800; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.title .brand .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--alert); box-shadow: 0 0 0 4px var(--alert-soft) }
.title .brand span.t { color: var(--muted); font-family: var(--f-body); font-weight: 500; font-size: 13px; letter-spacing: 0; text-transform: none; font-stretch: 100% }
.title h1 { font-family: var(--f-display); font-stretch: 76%; font-weight: 800; font-size: 66px; line-height: .95; margin: 14px 0 0; letter-spacing: -.005em }
.title h1 em { font-style: normal; color: var(--alert) }
.title p { margin: 12px 0 0; color: var(--muted); font-size: 16px; line-height: 1.45; max-width: 58ch }
.heros { position: absolute; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px }
.hs { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0 }
.hs .v { font-family: var(--f-display); font-stretch: 78%; font-weight: 800; font-size: 42px; line-height: 1; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap }
.hs .v small { font-family: var(--f-body); font-stretch: 100%; font-weight: 500; font-size: 14px; color: var(--muted) }
.hs .l { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.35 }
.hs.red .v { color: var(--alert) } .hs.blue .v { color: var(--ibm) }
.portrait .title h1 { font-size: 44px } .portrait .title p { font-size: 14px }
.portrait .hs { padding: 10px } .portrait .hs .v { font-size: 26px } .portrait .hs .v small { font-size: 11px } .portrait .hs .l { font-size: 11px }
.portrait .heros { gap: 8px }

/* regions */
.region { position: absolute; border-radius: 14px; background: color-mix(in srgb, var(--region) 80%, transparent); border: 1.2px solid var(--line); cursor: zoom-in; transition: border-color .2s }
.region:hover { border-color: var(--ink) }
.region .rl { position: absolute; left: 12px; top: 8px; font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap }
.region .rl b { color: var(--ink); font-weight: 600 }
.region.focus { cursor: default }
/* bubbles: sizes in em so they can shrink with --fs */
.bub { position: absolute; font-size: 12.5px; transform-origin: 0 0; border-radius: 999px; background: var(--panel); border: 1.3px solid var(--line); display: flex; flex-direction: column;
  justify-content: center; align-items: center; text-align: center; padding: .15em .8em; cursor: zoom-in; box-shadow: 0 8px 18px -14px rgba(15,26,42,.55);
  transition: left var(--morph), top var(--morph), width var(--morph), height var(--morph), transform var(--morph), opacity .4s, border-color .2s }
.bub:hover { border-color: var(--ink) }
.bub .bt { font-weight: 600; font-size: 1em; line-height: 1.15 }
.bub .bs { font-family: var(--f-mono); font-size: .76em; color: var(--muted); line-height: 1.25 }
.bub.ibm { background: var(--ibm-soft); border-color: var(--ibm) } .bub.ibm .bt { color: var(--ibm) }
.bub.red { background: var(--alert-soft); border-color: var(--alert) }
.bub.main { border-width: 2px } .bub.main .bt { font-size: 1.12em }
.bub.in { cursor: default; border-width: .5px }
.sat { position: absolute; font-family: var(--f-mono); font-size: 11px; color: var(--ibm); white-space: nowrap; transform-origin: 0 0; pointer-events: none;
  transition: left var(--morph), top var(--morph), transform var(--morph), opacity .4s }
.sat::before { content: ""; display: inline-block; width: .6em; height: .6em; border-radius: 50%; background: var(--ibm); margin-right: .35em }
.hush .bub.in, .hush .sat.in, .hush .edge.in { opacity: .06 }
.edge.gone, .sat.gone { opacity: 0 }
.slide:focus { outline: none }

/* slides: under the wires and bubbles */
.slidebg { position: absolute; transform-origin: 0 0; opacity: 0; transition: opacity .45s; background: var(--panel); border-radius: 14px; border: 1px solid var(--line); pointer-events: none }
.slide { position: absolute; transform-origin: 0 0; opacity: 0; pointer-events: none; transition: opacity .45s; font-size: 16px; line-height: 1.45 }
.slide.on, .slidebg.on { opacity: 1 }
.slide.on { pointer-events: auto }
.slide .sh, .slide .co { pointer-events: none } .slide .dbar, .slide .dpanel { pointer-events: auto }
.edge.ext { opacity: .45 } .edge.pulse.ext { opacity: .55 }
.edge.ext.wait { opacity: 0 }
.port { position: absolute; transform-origin: 0 0; width: 200px; font-size: 11px; line-height: 1.2; background: var(--panel); border: 1.2px dashed var(--muted); border-radius: 10px;
  padding: 6px 9px; opacity: 0; transition: opacity .45s; pointer-events: none; display: flex; flex-direction: column; gap: 2px }
.port.on { opacity: 1 }
.port .pk { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.port .pt { font-weight: 600; font-size: 11.5px; line-height: 1.15 }
.port.inp .pk::before { content: "→ " } .port.out .pk::after { content: " →" }
.hush .port.on { opacity: .06 }
.zoomed .region:not(.focus), .zoomed .bub:not(.in), .zoomed .sat:not(.in) { opacity: .1 }
.region { transition: border-color .2s, opacity .45s }
.sh { position: absolute; left: 56px; top: 40px; right: 56px }
.eyebrow { font-family: var(--f-mono); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
.eyebrow .ibmtag { color: var(--ibm); border: 1px solid var(--ibm); border-radius: 4px; padding: 0 6px }
.slide h2 { font-family: var(--f-display); font-stretch: 78%; font-weight: 800; font-size: 50px; line-height: 1; margin: 8px 0 8px; text-wrap: balance }
.slide .lede { font-size: 18.5px; margin: 0; max-width: 80ch; color: var(--muted) }
svg.conn { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none }
svg.conn path { fill: none; stroke: var(--ink); stroke-width: 1.2; opacity: .35 }
svg.conn circle { fill: var(--ink); opacity: .45 }
.co { position: absolute; transform: translateY(-50%); display: flex; flex-direction: column; gap: 3px }
.co.l { text-align: right; align-items: flex-end }
.co.b { transform: none; align-items: center; text-align: center }
.co.card { transform: none; align-items: flex-start; text-align: left; border-top: 2px solid var(--line); padding-top: 8px }
.co.card .cn { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.co.card.blue { border-top-color: var(--ibm) } .co.card.red { border-top-color: var(--alert) } .co.card.green { border-top-color: var(--ok) }
.co.card .cv { font-size: 34px } .co.card .ct { font-size: 15px } .co.card .cs { font-size: 13px }
.co.card .mini { grid-template-columns: 96px 1fr 26px; font-size: 12px; gap: 2px 8px }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 4px }
.chips span { font-family: var(--f-mono); font-size: 10px; line-height: 1.35; color: var(--ibm); border: 1px solid var(--ibm); border-radius: 99px; padding: 0 6px; background: var(--ibm-soft) }
.co .cv { font-family: var(--f-display); font-stretch: 78%; font-weight: 800; font-size: 40px; line-height: 1 }
.co .ct { font-size: 16px; line-height: 1.38 }
.co .cs { font-size: 13.5px; color: var(--muted); line-height: 1.35 }
.co.red .cv { color: var(--alert) } .co.blue .cv { color: var(--ibm) } .co.green .cv { color: var(--ok) }
.mini { display: grid; grid-template-columns: 110px 140px 28px; gap: 4px 8px; align-items: center; font-size: 13px; margin-top: 6px }
.mini .trk { height: 10px; background: var(--soft); border-radius: 3px; position: relative; overflow: hidden }
.mini .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--no) }
.mini .fill.red { background: var(--alert) } .mini .fill.ink { background: var(--ink) }
.mini .v { font-family: var(--f-mono); text-align: right }
.dbar { position: absolute; left: 56px; right: 56px; bottom: 30px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.dbar .lab { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 4px }
.pill { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 6px 14px; font-size: 14px; cursor: pointer }
.pill:hover { border-color: var(--ink) }
.pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.dpanel { position: absolute; left: 56px; right: 56px; top: 190px; bottom: 84px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 24px 50px -30px rgba(0,0,0,.55); padding: 20px 24px; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; font-size: 15.5px }
.dpanel h4 { margin: 0; font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500 }
.dpanel p { margin: 0 } .dpanel ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 5px }
.h3 { font-family: var(--f-mono); font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px }
.hbar { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) 70px; gap: 8px 12px; align-items: center; font-size: 15px }
.hbar .trk { height: 15px; background: var(--soft); border-radius: 4px; position: relative; overflow: hidden }
.hbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ibm); border-radius: 4px }
.hbar .fill.red { background: var(--alert) } .hbar .fill.grey { background: var(--no) } .hbar .fill.ink { background: var(--ink) }
.hbar .val { text-align: right; font-family: var(--f-mono); font-size: 14px }
.pair .trk .fill.base { background: var(--no); opacity: .55; top: auto; height: 6px }
.pair .trk .fill.red { bottom: auto; height: 9px }
.div { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr) minmax(0, 1fr); gap: 7px 10px; align-items: center; font-size: 15px }
.div .neg, .div .pos { height: 14px; position: relative }
.div .neg { border-right: 1.5px solid var(--ink) }
.div .neg span { position: absolute; right: 0; top: 0; bottom: 0; background: var(--alert); border-radius: 3px 0 0 3px }
.div .pos span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); border-radius: 0 3px 3px 0 }
.div .f .gt { font-family: var(--f-mono); font-size: 11px; color: var(--ibm); margin-left: 6px }
.divhead { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted) }
.divhead span:nth-child(2) { text-align: right }
.note { font-size: 14px; color: var(--muted); margin: 6px 0 0 }
table.t { border-collapse: collapse; width: 100%; font-size: 14.5px }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--soft); vertical-align: top }
table.t th { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 500 }
table.t td.n, table.t th.n { text-align: right; font-family: var(--f-mono); white-space: nowrap }
table.t tr.hl td { background: var(--ibm-soft) }
.yes { color: var(--ok); font-weight: 600 } .noo { color: var(--alert); font-weight: 600 }
.tools { display: flex; gap: 8px }
.tools input, .tools select { font: inherit; font-size: 15px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 0 }
.tools input { flex: 1 }
.cve { border-bottom: 1px solid var(--soft); padding: 9px 0; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px }
.cve .rk { font-family: var(--f-mono); color: var(--muted); font-size: 13px; padding-top: 2px }
.cve .id { font-family: var(--f-mono); font-weight: 600; font-size: 15px }
.cve .meta { font-size: 13.5px; color: var(--muted) }
.cve .why { font-size: 14.5px; margin-top: 2px }
.fl { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: 1px }
.fl b { font-family: var(--f-mono); font-size: 11px; font-weight: 600; border-radius: 3px; padding: 0 5px; background: var(--alert-soft); color: var(--alert) }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 500; align-self: flex-start }
.portrait .sh { left: 40px; right: 40px }
.portrait .slide h2 { font-size: 44px }
.portrait .colist { position: absolute; left: 40px; right: 40px; display: flex; flex-direction: column; gap: 18px }
.portrait .colist .co { position: static; transform: none; text-align: left; align-items: flex-start }
.portrait .dbar { left: 40px; right: 40px }
.portrait .co .cs { display: none } .portrait .co .cv { font-size: 34px } .portrait .co .ct { font-size: 16.5px }
.portrait .dpanel { left: 32px; right: 32px; top: 230px }

/* controls */
.hud { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 5; display: flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: 0 14px 34px -20px rgba(0,0,0,.55); max-width: calc(100% - 32px) }
.hud button { border: 0; background: transparent; border-radius: 8px; height: 36px; min-width: 36px; padding: 0 10px; cursor: pointer; font-size: 16px; display: grid; place-items: center }
.hud button:hover { background: var(--soft) }
.hud .play { background: var(--ink); color: var(--bg); font-weight: 600; font-size: 13.5px; padding: 0 16px }
.hud .play:hover { background: var(--ink); opacity: .9 }
.hud .where { font-size: 13px; padding: 0 8px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw }
.hud .where b { font-family: var(--f-mono); font-weight: 500; color: var(--muted); margin-right: 6px }
.prog { position: fixed; left: 0; top: env(safe-area-inset-top, 0px); height: 3px; background: var(--alert); z-index: 5; transition: width .5s }
.hint { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 4; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted) }
@media (max-width: 980px) { .hint { display: none } }
@media (prefers-reduced-motion: reduce) { :root { --morph: 0s } .edge.pulse { animation: none; stroke-dasharray: none } .slide { transition: none } }

/* icons + card visuals */
.bub { flex-direction: row; gap: .55em }
.bub .bx { display: flex; flex-direction: column; align-items: center; min-width: 0 }
.bub:not(.in) { gap: .3em } .bub:not(.in) .bi { width: 1.2em; height: 1.2em }
.bub .bi { transition: width .6s, height .6s; width: 1.7em; height: 1.7em; flex: none; color: var(--muted); stroke-width: 1.8 }
.bub.ibm .bi { color: var(--ibm) } .bub.red .bi { color: var(--alert) } .bub.main .bi { color: var(--ink) } .bub.main.in .bi { width: 2em; height: 2em }
.region .rl .ri { width: 13px; height: 13px; vertical-align: -2px; margin-right: 6px; color: var(--ink) }
.badge { position: absolute; right: 64px; top: 44px; width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center;
  background: color-mix(in srgb, var(--ibm) 8%, transparent); color: var(--ibm); border: 1.5px solid color-mix(in srgb, var(--ibm) 30%, transparent) }
.badge .big { width: 64px; height: 64px; stroke-width: 1.5 }
.cvrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 38px }
.vz { display: block; flex: none; overflow: visible }
.vz .vzt { font-family: var(--f-mono); font-size: 9.5px; fill: var(--muted); letter-spacing: .03em }
.vi .big { width: 36px; height: 36px; stroke-width: 1.6 }
.co.l:not(.card) .cvrow { justify-content: flex-end } .co.b:not(.card) .cvrow { justify-content: center }
.portrait .badge { width: 96px; height: 96px; right: 40px; top: 40px } .portrait .badge .big { width: 46px; height: 46px }

.slide h2 { font-size: 46px } .slide .lede { font-size: 17px }
.hero { position: absolute; left: 384px; top: 206px; width: 512px; height: 256px; padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 40px -26px rgba(15,26,42,.6); overflow: visible }
.hero text { font-family: var(--f-body, inherit) }
.hero .hl { font-size: 14px; fill: var(--ink) } .hero .hs { font-size: 12.5px; fill: var(--muted) }
.hero .hk { font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; fill: var(--muted) }
.hero .hb { font-family: var(--f-display); font-stretch: 78%; font-weight: 800; font-size: 26px; fill: var(--ink) }
.hero .hb2 { font-family: var(--f-display); font-stretch: 78%; font-weight: 800; font-size: 19px; fill: var(--ink) }
.hero .hw { font-family: var(--f-display); font-stretch: 78%; font-weight: 800; font-size: 18px; fill: var(--panel) }
.hero .hwl { font-size: 11px; fill: var(--panel); opacity: .92 }
.hero .red { fill: var(--alert) } .hero .blue { fill: var(--ibm) }
.portrait .hero { display: none } .portrait .sh { right: 40px }

/* equal-weight layout: header / flow band / visual + cards */
.sh { top: 30px } .slide h2 { font-size: 40px; margin: 6px 0 6px } .slide .lede { font-size: 15px; max-width: none }
.eyebrow { font-size: 11.5px }
.hero { left: 56px; top: 362px; width: 548px; height: 278px; padding: 14px 18px }

    slide.closeDetails = function () { pills.forEach(function (x) { x.classList.remove("on"); }); if (panel) { panel.remove(); panel = null; } world.classList.remove("hush"); };
  }

  /* ---------- camera: smooth zoom (van Wijk & Nuij); cam = {x, y, w}: centre and visible width in world units */
  var cam = null, anim = null, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function vw() { return stage.clientWidth; } function vh() { return stage.clientHeight; }
  function apply(c) { var k = vw() / c.w, tf = "translate(" + (vw() / 2 - c.x * k) + "px," + (vh() / 2 - c.y * k) + "px) scale(" + k + ")"; world.style.transform = tf; $("#demoLayer").style.transform = tf; }
  function fitRect(r, m, padBottom) {
    var avH = vh() - padBottom, need = Math.max(r.w, r.h * vw() / avH) * m;
    return { x: r.x + r.w / 2, y: r.y + r.h / 2 + (padBottom / 2) * need / vw(), w: need };
  }
  function interp(p0, p1) {
    var rho = (p0.w < WB.w * .5 && p1.w < WB.w * .5) ? .55 : Math.SQRT2, ux0 = p0.x, uy0 = p0.y, w0 = p0.w, dx = p1.x - ux0, dy = p1.y - uy0, w1 = p1.w, d2 = dx * dx + dy * dy, f, S2;
    if (d2 < 1e-6) { S2 = Math.log(w1 / w0) / rho; f = function (t) { return { x: ux0 + t * dx, y: uy0 + t * dy, w: w0 * Math.exp(rho * t * S2) }; }; }
    else {
      var d1 = Math.sqrt(d2), b0 = (w1 * w1 - w0 * w0 + 4 * d2) / (4 * w0 * d1), b1 = (w1 * w1 - w0 * w0 - 4 * d2) / (4 * w1 * d1),
        r0 = Math.log(Math.sqrt(b0 * b0 + 1) - b0), r1 = Math.log(Math.sqrt(b1 * b1 + 1) - b1);
      S2 = (r1 - r0) / rho;
      f = function (t) { var s = t * S2, c0 = Math.cosh(r0), u = w0 / (2 * d1) * (c0 * Math.tanh(rho * s + r0) - Math.sinh(r0)); return { x: ux0 + u * dx, y: uy0 + u * dy, w: w0 * c0 / Math.cosh(rho * s + r0) }; };
    }
    f.duration = Math.min(1900, Math.max(800, Math.abs(S2) * 850)); return f;
  }
  function fly(target, done, at, soft) {   // at: optional [fraction, fn], fn runs once the flight is that far along; soft: sine easing (moves sooner)
    if (anim) cancelAnimationFrame(anim);
    if (!cam || reduce) { cam = target; apply(cam); if (done) done(); return; }
    var f = interp(cam, target), t0 = performance.now(); if (soft) f.duration *= .75;
    function tick(now) {
      var t = Math.min(1, (now - t0) / f.duration), e = soft ? (1 - Math.cos(Math.PI * t)) / 2 : t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      cam = f(e); apply(cam);
      if (at && t >= at[0]) { var fn = at[1]; at = null; fn(); }
      if (t < 1) anim = requestAnimationFrame(tick); else { anim = null; cam = target; apply(cam); if (done) done(); }
    }
    anim = requestAnimationFrame(tick);
  }

  /* ---------- navigation */
  var idx = -1, goSeq = 0;
  var DEMO = PATH.length, locked = false;
  function targetFor(step) { return step === DEMO ? fitRect(R.demo, 1, 0) : step < 0 ? fitRect({ x: 0, y: 0, w: WB.w, h: WB.h }, 1.02, 64) : fitRect(R[PATH[step]], 1.03, 64); }
  function setLocked(on) { locked = on; document.body.classList.toggle("locked", on); if (!on) document.body.classList.remove("landed"); }
  function go(step) {
    step = Math.max(-1, Math.min(DEMO, step)); idx = step;
    var id = step >= 0 && step < DEMO ? PATH[step] : null;
    setLocked(step === DEMO);
    world.querySelectorAll(".slide, .slidebg").forEach(function (n) { if (n.closeDetails) n.closeDetails(); n.classList.remove("on"); });
    var from = focusId, seq = ++goSeq; world.classList.remove("between");
    function land() { if (seq !== goSeq) return; if (leaving) { leaving = null; place(); } if (step === DEMO && idx === DEMO) document.body.classList.add("landed"); if (id) { world.querySelectorAll('[data-s="' + id + '"]').forEach(function (n) { n.classList.add("on"); }); if (!portrait) ports.forEach(function (pt) { if (pt.s.id === id) pt.el.classList.add("on"); }); world.querySelectorAll(".edge.wait").forEach(function (e) { e.classList.remove("wait"); e.classList.add("ext-shown"); }); var n = world.querySelector('.slide[data-s="' + id + '"]'); if (n) { n.tabIndex = -1; n.focus({ preventScroll: true }); } } }
    function focusOn() { world.querySelectorAll(".region").forEach(function (n) { n.classList.toggle("focus", n.getAttribute("data-r") === id); }); }
    world.querySelectorAll(".edge.ext-shown").forEach(function (e) { e.classList.remove("ext-shown"); });
    if (from && id && from !== id && !reduce && !portrait) {
      /* slide -> slide in three beats: (1) this slide unfolds back into the overview's big nodes with every wire showing,
         (2) the camera travels along those wires, (3) the next slide's nodes fold into its layout, then its panel fades in */
      leaving = null; focusId = null; world.classList.add("between"); place();
      /* the beats overlap: the camera leaves while the nodes are still unfolding, and the next slide starts folding
         in for the last part of the flight, so the whole move takes little longer than the flight itself */
      var folded = 0, foldIn = function () {
        if (seq !== goSeq) return;
        world.classList.remove("between"); focusId = id; focusOn(); place(); folded = Date.now();
      };
      setTimeout(function () {
        if (seq !== goSeq) return;
        fly(targetFor(step), function () {
          if (seq !== goSeq) return;
          if (!folded) foldIn();
          setTimeout(land, Math.max(0, 450 - (Date.now() - folded)));
        }, [.4, foldIn], true);
      }, 120);
    } else {
      focusOn(); leaving = from && id && from !== id ? from : null;
      focusId = id; world.classList.toggle("zoomed", !!id); place();   // bubbles start shrinking into the slide while the camera flies
      fly(targetFor(step), land);
    }
    $("#where").innerHTML = id ? "<b>" + (step + 1) + " / " + PATH.length + "</b>" + esc(byId[id].t) : step === DEMO ? "Demo" : "Overview";
    $("#play").textContent = step < 0 ? "Start the tour" : step === DEMO - 1 ? "Try it →" : "Next";
    $("#prog").style.width = (100 * (step + 1) / PATH.length) + "%";
    try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); } catch (e) {}
  }
  $("#home").addEventListener("click", function () { go(-1); });
  $("#prev").addEventListener("click", function () { go(idx - 1); });
  $("#next").addEventListener("click", function () { go(idx + 1); });
  $("#play").addEventListener("click", function () { go(idx + 1); });
  $("#demoBtn").addEventListener("click", function () { go(DEMO); });
  $("#demoCatch").addEventListener("click", function (e) { e.stopPropagation(); go(DEMO); });
  stage.addEventListener("click", function () { if (idx >= 0 && !locked) go(-1); });
  function setTheme(t) {   // one theme for the whole page: the demo's toggle drives it, remembered under the demo's key
    if (t !== "light" && t !== "dark") return;
    document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("br-theme", t); } catch (e) {}
  }
  try { var t0 = localStorage.getItem("br-theme"); if (t0) document.documentElement.setAttribute("data-theme", t0); } catch (e) {}
  window.addEventListener("message", function (e) {   // from the demo page (scan.html)
    var m = e.data || {}; if (!m.kevcast) return;
    if (m.theme) { setTheme(m.theme); return; }
    if (m.tour) go(-1);
    else if (m.go && PATH.indexOf(m.go) >= 0) go(PATH.indexOf(m.go));
  });
  document.addEventListener("keydown", function (e) {
    var tg = e.target || {};
    if (/INPUT|SELECT|TEXTAREA|BUTTON/.test(tg.tagName || "") && (e.key === " " || e.key === "Enter")) return;
    if (/INPUT|SELECT|TEXTAREA/.test(tg.tagName || "") || locked) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); go(idx + 1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(idx - 1); }
    else if (e.key === "Escape") { var on = world.querySelector(".slide.on"); if (on && world.classList.contains("hush")) on.closeDetails(); else go(-1); }
    else if (e.key === "Home") go(-1);
  });

  /* ---------- the list (inside a detail panel) */
  function initList(node) {
    var shown = 30, q = $(".q", node), mf = $(".mf", node), box2 = $(".cves", node), more = $(".more", node), L = "EMNG";
    function render() {
      var s = (q.value || "").toLowerCase(), m = mf.value;
      var rows = top.filter(function (r) { return (!m || r.m === m) && (!s || (r.id + " " + r.p + " " + r.cat + " " + r.why).toLowerCase().indexOf(s) >= 0); });
      box2.innerHTML = rows.slice(0, shown).map(function (r) {
        var fl = r.fl.split("").map(function (b, i) { return b === "1" ? "<b>" + L[i] + "</b>" : ""; }).join("");
        var prod = r.p && r.p !== "unknown" ? esc(r.p) + " · " : "";
        return '<div class="cve"><div class="rk">#' + r.r + '</div><div><div><span class="id">' + esc(r.id) + '</span><span class="fl">' + fl + '</span></div><div class="meta">' + prod + esc(r.cat) + " · " + r.m + (r.e != null ? " · EPSS " + r.e : "") + '</div><div class="why">' + esc(r.why) + "</div></div></div>";
      }).join("") || '<p class="note">No bug in our 500 matches that search.</p>';
      more.hidden = rows.length <= shown;
    }
    q.addEventListener("input", function () { shown = 30; render(); });
    mf.addEventListener("change", function () { shown = 30; render(); });
    more.addEventListener("click", function () { shown += 50; render(); });
    render();
  }

  /* ---------- boot */
  build();
  var start = PATH.indexOf((location.hash || "").replace("#", ""));
  if (start >= 0) { go(-1); go(start); }
  else { idx = DEMO; setLocked(true); document.body.classList.add("landed"); cam = targetFor(DEMO); apply(cam); $("#where").textContent = "Demo"; }
  var rt, wasPortrait = portrait;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () {
    var p = stage.clientWidth < stage.clientHeight * 0.9;
    if (p !== wasPortrait) { wasPortrait = p; var keep = idx; build(); cam = null; go(-1); if (keep >= 0) go(keep); }
    else { placeDemo(); cam = targetFor(idx); apply(cam); }
  }, 120); });
})();
</script>
